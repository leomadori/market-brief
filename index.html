<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Market Brief</title>
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Market Brief">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --news: #0f766e; --news-bg: #ccfbf1; --reddit: #c2410c; --reddit-bg: #ffedd5;
    --trend: #b91c1c; --trend-bg: #fee2e2; --new: #7c3aed; --new-bg: #ede9fe; --hover: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --panel: #161a22; --text: #e6e8ec; --muted: #8b93a1; --line: #262c37;
      --accent: #60a5fa; --news: #5eead4; --news-bg: #134e4a; --reddit: #fdba74; --reddit-bg: #4a2511;
      --trend: #fca5a5; --trend-bg: #4c1717; --new: #c4b5fd; --new-bg: #2e1f5e; --hover: #1d2330;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto;
          padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                   max(60px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .updated { color: var(--muted); font-size: 13px; }
  .updated.stale { color: var(--trend); }

  .trends { margin: 16px 0 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .trends .label { color: var(--muted); font-size: 13px; margin-right: 2px; }
  .trend-chip { background: var(--trend-bg); color: var(--trend); border: 0; border-radius: 999px;
                padding: 3px 10px; font-size: 13px; cursor: pointer; }
  .trend-chip small { opacity: .75; }

  nav.tabs { position: sticky; top: 0; z-index: 2; background: var(--bg); margin: 12px -16px 0;
             padding: 10px 16px; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--line);
             scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--text);
         border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .tab .n { color: var(--muted); margin-left: 4px; font-size: 12px; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab.active .n { color: rgba(255,255,255,.8); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .controls input[type=search] { flex: 1 1 220px; padding: 8px 12px; border-radius: 8px;
         border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--text); padding: 7px 12px; font: inherit;
                font-size: 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--hover); font-weight: 600; }

  section.topic { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
                  margin: 14px 0; overflow: hidden; }
  section.topic h2 { font-size: 16px; margin: 0; padding: 12px 14px; display: flex; align-items: center;
                     gap: 8px; border-bottom: 1px solid var(--line); }
  section.topic h2 .count { color: var(--muted); font-weight: 400; font-size: 13px; }
  section.topic h2 .kind { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
                           padding: 2px 7px; border-radius: 999px; background: var(--trend-bg); color: var(--trend); }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.item { border-top: 1px solid var(--line); }
  li.item:first-child { border-top: 0; }
  li.item a { display: block; padding: 10px 14px; color: inherit; text-decoration: none; }
  li.item a:hover { background: var(--hover); }
  li.item a:visited .title { color: var(--muted); }
  .title { font-weight: 500; }
  .meta { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
          color: var(--muted); font-size: 12.5px; }
  .src { padding: 1px 7px; border-radius: 5px; font-weight: 600; font-size: 12px; }
  .src.news { background: var(--news-bg); color: var(--news); }
  .src.reddit { background: var(--reddit-bg); color: var(--reddit); }
  .badge-new { background: var(--new-bg); color: var(--new); padding: 1px 6px; border-radius: 5px;
               font-weight: 700; font-size: 11px; letter-spacing: .03em; }
  .tag { border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; font-size: 11.5px; }
  .more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: none;
          color: var(--accent); padding: 10px; font: inherit; font-size: 14px; cursor: pointer; }
  .more:hover { background: var(--hover); }
  .empty, .error { text-align: center; color: var(--muted); padding: 40px 16px; }
  .error code { background: var(--panel); border: 1px solid var(--line); padding: 2px 6px; border-radius: 5px; }
  footer { color: var(--muted); font-size: 12.5px; margin-top: 24px; }
  footer details summary { cursor: pointer; }
  footer .disclaimer { margin-top: 10px; }
  @media (pointer: coarse) {
    .tab { padding: 8px 14px; }
    .seg button { padding: 9px 14px; }
    li.item a { padding: 12px 14px; }
  }
  footer .bad { color: var(--trend); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Market Brief</h1>
    <span class="updated" id="updated"></span>
  </header>
  <div class="trends" id="trends"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter headlines…" aria-label="Filter headlines">
    <div class="seg" id="typeSeg">
      <button data-v="all" class="on">All</button><button data-v="news">News</button><button data-v="reddit">Reddit</button>
    </div>
    <div class="seg" id="newSeg">
      <button data-v="all" class="on">Everything</button><button data-v="new">New only</button>
    </div>
  </div>
  <main id="main"></main>
  <footer id="footer"></footer>
</div>

<script src="data/latest.js"></script>
<script>
(() => {
  const D = window.DASHBOARD_DATA;
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  if (!D) {
    $("main").innerHTML = '<div class="error">No data yet. Run <code>python3 fetch.py</code> in the market-dashboard folder, then reload.</div>';
    return;
  }

  const PREVIEW = 6; // headlines per topic on the "All" tab
  const generated = new Date(D.generated_at);
  const newCutoff = generated - 24 * 3600e3;
  const isNew = (i) => !D.first_run && new Date(i.first_seen) >= newCutoff;
  const state = { tab: "All", type: "all", onlyNew: false, q: "", expanded: new Set() };
  try { Object.assign(state, { tab: localStorage.getItem("mb.tab") || "All" }); } catch {}

  function ago(iso) {
    if (!iso) return "";
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 60) return `${Math.max(m, 1)}m ago`;
    const h = Math.round(m / 60);
    return h < 48 ? `${h}h ago` : `${Math.round(h / 24)}d ago`;
  }
  const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "#";

  // Header
  const ageH = (Date.now() - generated) / 3600e3;
  $("updated").textContent = `Updated ${generated.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })}`
    + (ageH > 26 ? " · data is over a day old" : "");
  if (ageH > 26) $("updated").classList.add("stale");

  // Trend chips
  const trendTopics = D.topics.filter((t) => t.kind !== "core");
  if (trendTopics.length) {
    $("trends").append(el("span", "label", "🔥 Trending:"));
    for (const t of trendTopics) {
      const b = el("button", "trend-chip", (t.kind === "pinned" ? "📌 " : "") + t.name + " ");
      if (t.count) b.append(el("small", null, `×${t.count}`));
      b.title = t.kind === "pinned" ? "Pinned topic" : `In ${t.count} headlines today · first seen ${t.first_seen}`;
      b.onclick = () => setTab(t.name);
      $("trends").append(b);
    }
  }

  function setTab(name) {
    state.tab = D.topics.some((t) => t.name === name) ? name : "All";
    try { localStorage.setItem("mb.tab", state.tab); } catch {}
    render();
    window.scrollTo({ top: 0 });
  }

  function filtered(items) {
    const q = state.q.toLowerCase();
    return items.filter((i) =>
      (state.type === "all" || i.type === state.type) &&
      (!state.onlyNew || isNew(i)) &&
      (!q || i.title.toLowerCase().includes(q) || i.source.toLowerCase().includes(q)));
  }

  function itemEl(i, currentTopic) {
    const li = el("li", "item");
    const a = el("a");
    a.href = safeUrl(i.url); a.target = "_blank"; a.rel = "noopener noreferrer";
    a.append(el("div", "title", i.title));
    const meta = el("div", "meta");
    if (isNew(i)) meta.append(el("span", "badge-new", "NEW"));
    meta.append(el("span", `src ${i.type}`, i.source));
    meta.append(el("span", null, ago(i.published || i.first_seen)));
    for (const t of i.topics) if (t !== currentTopic) meta.append(el("span", "tag", t));
    a.append(meta);
    li.append(a);
    return li;
  }

  function topicSection(topic, items, preview) {
    const s = el("section", "topic");
    const h = el("h2");
    h.append(el("span", null, topic.name));
    if (topic.kind === "trend") h.append(el("span", "kind", "🔥 trend"));
    if (topic.kind === "pinned") h.append(el("span", "kind", "📌 pinned"));
    h.append(el("span", "count", `${items.length}`));
    s.append(h);
    const ul = el("ul", "items");
    const showAll = !preview || state.expanded.has(topic.name);
    const shown = showAll ? items : items.slice(0, PREVIEW);
    if (!shown.length) ul.append(el("li", "empty", "Nothing matches."));
    shown.forEach((i) => ul.append(itemEl(i, topic.name)));
    s.append(ul);
    if (preview && items.length > PREVIEW) {
      const b = el("button", "more", showAll ? "Show less" : `Show all ${items.length}`);
      b.onclick = () => { showAll ? state.expanded.delete(topic.name) : state.expanded.add(topic.name); render(); };
      s.append(b);
    }
    return s;
  }

  function render() {
    // Tabs
    const tabs = $("tabs"); tabs.replaceChildren();
    const all = filtered(D.items);
    const mk = (name, n, prefix = "") => {
      const b = el("button", "tab" + (state.tab === name ? " active" : ""), prefix + name);
      b.append(el("span", "n", n));
      b.onclick = () => setTab(name);
      tabs.append(b);
    };
    mk("All", all.length);
    for (const t of D.topics) {
      mk(t.name, all.filter((i) => i.topics.includes(t.name)).length,
         t.kind === "trend" ? "🔥 " : t.kind === "pinned" ? "📌 " : "");
    }

    // Content
    const main = $("main"); main.replaceChildren();
    const topics = state.tab === "All" ? D.topics : D.topics.filter((t) => t.name === state.tab);
    for (const t of topics) {
      const items = all.filter((i) => i.topics.includes(t.name));
      if (state.tab === "All" && !items.length) continue;
      main.append(topicSection(t, items, state.tab === "All"));
    }
    if (!main.children.length) main.append(el("div", "empty", "No headlines match these filters."));
  }

  // Controls
  $("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });
  for (const [segId, key, map] of [["typeSeg", "type", (v) => v], ["newSeg", "onlyNew", (v) => v === "new"]]) {
    $(segId).addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      for (const x of $(segId).children) x.classList.toggle("on", x === b);
      state[key] = map(b.dataset.v); render();
    });
  }
  if (D.first_run) $("newSeg").style.display = "none";

  // Footer: source health
  const bad = Object.entries(D.sources).filter(([, v]) => v !== "ok");
  const f = $("footer");
  const det = el("details");
  det.append(el("summary", bad.length ? "bad" : null,
    `${Object.keys(D.sources).length} sources checked` + (bad.length ? ` · ${bad.length} with problems` : " · all OK")
    + ` · ${D.items.length} headlines · trend history: ${D.baseline_days} day(s)`));
  const ul = el("ul");
  for (const [k, v] of Object.entries(D.sources)) ul.append(el("li", v === "ok" ? null : "bad", `${k}: ${v}`));
  det.append(ul);
  f.append(det);
  f.append(el("p", "disclaimer", "Headlines aggregated automatically from public news feeds and Reddit. Not financial advice."));

  render();
})();
</script>
</body>
</html>
