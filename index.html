<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Market Brief</title>
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Market Brief">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
  /* Late-90s web: white page, Times, blue underlined links, square everything. */
  :root {
    --link: #0000ee; --visited: #551a8b; --text: #000; --muted: #555; --rule: #999;
    --red: #b22222; --navy: #1a2a6c; --rust: #a0381c; --plum: #4b3b5c; --blue: #1f5fa8;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  body { margin: 0; background: #fff; color: var(--text);
         font: 17px/1.35 "Times New Roman", Times, Georgia, serif; }
  a { color: var(--link); }
  a:visited { color: var(--visited); }
  .wrap { max-width: 1180px; margin: 0 auto;
          padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                   max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  /* Odometer (top-left) */
  .wrap { position: relative; }
  .odometer { position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left));
              text-align: center; font: 9px Verdana, Geneva, sans-serif; letter-spacing: .12em; color: var(--muted); }
  .odometer .digits { display: inline-flex; gap: 2px; padding: 3px; background: #c0c0c0;
              border: 2px inset #e8e8e8; margin-bottom: 3px; }
  .odometer .d { width: 15px; height: 22px; background: #111; color: #39ff14; display: grid; place-items: center;
              font: bold 17px "Courier New", Courier, monospace; text-shadow: 0 0 4px rgba(57,255,20,.6);
              border-top: 1px solid #444; border-bottom: 1px solid #000; }

  /* Masthead */
  .masthead { text-align: center; padding: 10px 0 6px; }
  .masthead h1 { margin: 0; font-size: clamp(40px, 9vw, 84px); font-weight: 700; letter-spacing: .06em;
                 color: var(--red); text-shadow: 3px 3px 0 #e6c9a8; line-height: 1; }
  .masthead .tagline { font-style: italic; color: var(--muted); margin-top: 6px; font-size: 16px; }
  .jump { margin-top: 10px; font: 12px Verdana, Geneva, sans-serif; }
  .jump select { font: 12px Verdana, sans-serif; padding: 1px 2px; border: 2px inset #ddd; background: #fff; }
  hr.groove { border: 0; border-top: 2px groove #ccc; margin: 14px 0; }
  .dateline { font: 12px Verdana, Geneva, sans-serif; color: var(--muted); text-align: center; }
  .dateline.stale { color: var(--red); font-weight: bold; }

  /* Market bar: price ticker + Fear & Greed */
  .marketbar { display: flex; gap: 10px; align-items: center; margin: 0 0 10px; }
  .ticker { flex: 1; min-width: 0; overflow: hidden; background: #000; border: 2px inset #888;
            font: bold 14px/1 "Courier New", Courier, monospace; color: #ffb000; display: flex; align-items: center; }
  .ticker .track { display: inline-flex; white-space: nowrap; animation: scroll 30s linear infinite; padding: 10px 0; }
  .ticker .track span { padding: 0 22px; }
  .ticker .up { color: #39ff14; } .ticker .down { color: #ff4040; } .ticker .flat { color: #aaa; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .ticker .track { animation: none; } }
  .fng { flex: none; width: 190px; border: 2px inset #ddd; background: #f4f4f4; padding: 4px 8px 5px;
         font: 10px Verdana, Geneva, sans-serif; color: var(--muted); }
  .fng .row { display: flex; justify-content: space-between; align-items: baseline; }
  .fng .num { font: bold 18px Verdana, sans-serif; color: #000; }
  .fng .lbl { font-weight: bold; letter-spacing: .08em; }
  .fng .bar { position: relative; height: 8px; margin: 3px 0 1px;
              background: linear-gradient(90deg, #ea3943, #ea8c00, #f3d42f, #93d900, #16c784); }
  .fng .dot { position: absolute; top: -4px; width: 6px; height: 14px; margin-left: -3px; background: #fff;
              border: 2px solid #000; }

  /* Pull quote */
  .quote { text-align: center; color: var(--red); margin: 22px auto 6px; max-width: 760px; }
  .quote .q { font: 600 clamp(20px, 3.4vw, 30px)/1.25 "Gill Sans", "Trebuchet MS", sans-serif; }
  .quote .who { font: 18px "Gill Sans", "Trebuchet MS", sans-serif; margin-top: 6px; }
  .also { text-align: center; font-size: 15px; margin: 8px 0 0; }
  .also a { margin: 0 4px; }

  /* Top stories */
  .stories { max-width: 820px; margin: 26px auto 0; border: 1px solid #999; padding: 0 16px 10px;
             box-shadow: 3px 3px 4px rgba(0,0,0,.12); }
  .stories h2 { text-align: center; margin: -14px 0 10px; }
  .stories h2 span { display: inline-block; background: #fff; padding: 4px 12px 3px; color: var(--navy);
             border-right: 3px solid #aaa; border-bottom: 3px solid #aaa; box-shadow: 3px 3px 4px rgba(0,0,0,.18);
             font: bold 15px Verdana, Geneva, sans-serif; letter-spacing: .32em; }
  .stories ol { margin: 0; padding-left: 26px; }
  .stories li { margin: 0 0 7px; }
  .stories summary { cursor: pointer; display: flex; align-items: baseline; gap: 6px; list-style: none; }
  .stories summary::-webkit-details-marker { display: none; }
  .stories summary .t { color: var(--link); text-decoration: underline; }
  .stories summary .dots { flex: 1; border-bottom: 2px dotted #bbb; min-width: 12px; transform: translateY(-4px); }
  .stories summary .n { font: bold 12px Verdana, sans-serif; color: var(--red); white-space: nowrap; }
  .stories details[open] summary .t { font-weight: bold; }
  .stories ul { list-style: square; margin: 6px 0 10px; padding-left: 20px; }
  .stories ul li { margin: 0 0 5px; font-size: 15px; }
  .stories .meta { display: inline; margin-left: 4px; }
  .stories .hint { text-align: center; font: 11px Verdana, sans-serif; color: var(--muted); margin: 6px 0 0; }

  /* Tabs: letter-spaced caps on a shadowed "tab" */
  nav.tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; margin: 26px 0 8px; }
  .tab { background: #fff; border: 0; border-right: 3px solid #aaa; border-bottom: 3px solid #aaa;
         box-shadow: 3px 3px 4px rgba(0,0,0,.18); padding: 5px 14px 4px; cursor: pointer;
         font: bold 14px Verdana, Geneva, sans-serif; letter-spacing: .32em; text-transform: uppercase; }
  .tab .n { font-weight: normal; letter-spacing: 0; color: var(--muted); font-size: 11px; margin-left: 2px; }
  .tab.active { background: #fffbe6; border-color: #888; }

  /* Controls: classic form widgets */
  .controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 14px;
              margin: 16px 0 6px; font: 13px Verdana, Geneva, sans-serif; }
  .controls input[type=search] { font: 14px Verdana, sans-serif; padding: 3px 5px; width: min(320px, 100%);
              border: 2px inset #ddd; background: #fff; }
  .seg { display: inline-flex; gap: 4px; }
  .seg button { font: 12px Verdana, sans-serif; padding: 3px 10px; background: #dcdcdc; color: #000;
                border: 2px outset #f4f4f4; cursor: pointer; }
  .seg button.on { border-style: inset; background: #c8c8c8; font-weight: bold; }

  /* Topic columns */
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 26px 26px;
         margin-top: 22px; align-items: start; }
  main.single { grid-template-columns: minmax(0, 760px); justify-content: center; }
  section.topic h2 { margin: 0 0 12px; text-align: center; }
  section.topic h2 span.label { display: inline-block; padding: 4px 12px 3px; background: #fff;
         border-right: 3px solid #aaa; border-bottom: 3px solid #aaa; box-shadow: 3px 3px 4px rgba(0,0,0,.18);
         font: bold 15px Verdana, Geneva, sans-serif; letter-spacing: .32em; text-transform: uppercase; }
  section.topic h2 .count { display: block; font: 11px Verdana, sans-serif; color: var(--muted);
         letter-spacing: 0; margin-top: 6px; font-weight: normal; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.item { margin: 0 0 11px; }
  li.item a.title { font-size: 17px; }
  li.item.is-new a.title { font-weight: bold; }
  .meta { font: 11px/1.5 Verdana, Geneva, sans-serif; color: var(--muted); margin-top: 1px; }
  .meta .src.reddit { color: #c45500; }
  .meta .tag { color: #777; }
  .more { display: block; margin: 4px auto 0; background: none; border: 0; cursor: pointer;
          font: 13px Verdana, sans-serif; color: var(--link); text-decoration: underline; }
  .empty { text-align: center; color: var(--muted); font-style: italic; padding: 30px 0; }
  .error { text-align: center; padding: 40px 0; }

  figure.korova { margin: 34px auto 0; width: min(585px, 100%); text-align: center; }
  figure.korova img { display: block; width: 100%; height: auto; aspect-ratio: 2000 / 1386;
                      border: 1px solid #000; box-shadow: 3px 3px 4px rgba(0,0,0,.18); }
  figure.korova figcaption { margin-top: 10px; font-style: italic; font-size: 17px; line-height: 1.4; }

  footer { text-align: center; margin-top: 34px; font-size: 15px; }
  footer .note { margin: 0 0 10px; }
  footer .small { font: 11px/1.6 Verdana, Geneva, sans-serif; color: var(--muted); }
  footer details { display: inline-block; text-align: left; }
  footer details summary { cursor: pointer; text-align: center; }
  footer .bad { color: var(--red); }

  @media (max-width: 1100px) {  /* below this the absolute odometer collides with the masthead */
    .odometer { position: static; margin: 0 0 8px; width: max-content; }
  }
  @media (max-width: 560px) {
    body { font-size: 16px; }
    .marketbar { flex-direction: column; }
    .fng { width: 100%; }
    .stories { padding: 0 10px 8px; }
    .stories summary { display: block; }
    .stories summary .dots { display: none; }
    .stories summary .n { margin-left: 4px; }
    .tab { letter-spacing: .18em; font-size: 12px; padding: 6px 10px 5px; }
    section.topic h2 span.label { letter-spacing: .24em; }
    li.item { margin-bottom: 13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="odometer" id="odometer" hidden></div>
  <div class="masthead">
    <h1>MARKET BRIEF</h1>
    <div class="tagline">Your daily dispatch from the markets &amp; the crypto-sphere</div>
    <form class="jump" onsubmit="return false">
      <label for="jump">Go to:</label>
      <select id="jump" onchange="location.href = this.value">
        <option value="index.html" selected>Market Brief</option>
        <option value="reddit.html">Reddit Boiling Point</option>
      </select>
    </form>
  </div>
  <hr class="groove">
  <div class="marketbar" id="marketbar" hidden>
    <div class="ticker" aria-label="Crypto prices"><div class="track" id="track"></div></div>
    <div class="fng" id="fng" hidden></div>
  </div>
  <div class="dateline" id="updated"></div>
  <div id="quote"></div>
  <div id="stories"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="controls">
    <input type="search" id="q" placeholder="Search headlines..." aria-label="Filter headlines">
    <span class="seg" id="newSeg"><button data-v="all" class="on">Everything</button><button data-v="new">New only</button></span>
  </div>
  <main id="main"></main>
  <figure class="korova">
    <img src="assets/korova.webp" width="2000" height="1386" loading="lazy" alt="Four men in bowler hats and white outfits holding glasses of milk at the Korova Milk Bar">
    <figcaption>&ldquo;Welly, welly, welly, welly, welly, welly, well. To what do I owe the extreme pleasure of this surprising visit?&rdquo;</figcaption>
  </figure>
  <hr class="groove">
  <footer id="footer"></footer>
</div>

<script src="data/latest.js?v=20261010171212"></script>
<script>
(() => {
  const D = window.DASHBOARD_DATA;
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  if (!D) {
    $("main").innerHTML = '<div class="error">No data yet. Run <code>python3 fetch.py</code>, then reload.</div>';
    return;
  }

  const PREVIEW = 6;
  const COLORS = ["--red", "--navy", "--rust", "--plum", "--blue"];
  const generated = new Date(D.generated_at);
  const newCutoff = generated - 24 * 3600e3;
  const isNew = (i) => !D.first_run && new Date(i.first_seen) >= newCutoff;
  const state = { tab: "All", type: "all", onlyNew: false, q: "", expanded: new Set() };
  try { state.tab = localStorage.getItem("mb.tab") || "All"; } catch {}
  const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "#";
  function ago(iso) {
    if (!iso) return "";
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 60) return `${Math.max(m, 1)} min. ago`;
    const h = Math.round(m / 60);
    return h < 48 ? `${h} hr. ago` : `${Math.round(h / 24)} days ago`;
  }

  // Dateline, old-school
  const ageH = (Date.now() - generated) / 3600e3;
  $("updated").textContent = "Last updated: " + generated.toLocaleString("en-US",
    { weekday: "short", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" })
    + (ageH > 26 ? "  —  data is over a day old" : "");
  if (ageH > 26) $("updated").classList.add("stale");

  // Pull quote: the day's top trend
  const trends = D.topics.filter((t) => t.kind !== "core");
  if (trends.length) {
    const top = trends[0];
    const q = el("div", "quote");
    const n = D.items.filter((i) => i.topics.includes(top.name)).length;
    q.append(el("div", "q", `“${top.name} turned up in ${n} headlines today.”`));
    q.append(el("div", "who", `—The Trend Desk, ${generated.toLocaleDateString("en-US", { weekday: "long" })}`));
    $("quote").append(q);
    if (trends.length > 1) {
      const also = el("p", "also", "Also trending: ");
      trends.slice(1).forEach((t, k) => {
        const a = el("a", null, t.name); a.href = "#"; a.onclick = (e) => { e.preventDefault(); setTab(t.name); };
        also.append(a); if (k < trends.length - 2) also.append(" · ");
      });
      $("quote").append(also);
    }
  }

  // Live market data, fetched in the browser on each visit (free APIs, no key).
  async function loadPrices() {
    try {
      const api = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc";
      const [top, stables] = await Promise.all([
        fetch(api + "&per_page=50").then((r) => r.json()),
        fetch(api + "&category=stablecoins&per_page=100").then((r) => r.json()),
      ]);
      const stableIds = new Set(stables.map((c) => c.id));
      const coins = top.filter((c) => !stableIds.has(c.id)).slice(0, 20);
      const once = coins.map((c) => {
        const ch = c.price_change_percentage_24h || 0, sp = el("span");
        sp.append(`${c.symbol.toUpperCase()} $${c.current_price.toLocaleString("en-US",
            { minimumFractionDigits: 2, maximumFractionDigits: c.current_price < 10 ? 4 : 2 })} `,
          Math.abs(ch) < 0.005 ? el("b", "flat", "\u25C6 0.00%")
            : el("b", ch > 0 ? "up" : "down", `${ch > 0 ? "\u25B2" : "\u25BC"} ${Math.abs(ch).toFixed(2)}%`));
        return sp;
      });
      if (!once.length) return;
      // Two copies + scroll by -50% = seamless loop (20 coins are always wider than the bar).
      const track = $("track"); track.replaceChildren();
      for (let k = 0; k < 2; k++) once.forEach((sp) => track.append(sp.cloneNode(true)));
      track.style.animationDuration = `${once.length * 4}s`;  // constant speed regardless of coin count
      $("marketbar").hidden = false;
    } catch {}
  }
  async function loadFng() {
    try {
      const d = (await (await fetch("https://api.alternative.me/fng/?limit=1")).json()).data[0];
      const f = $("fng"); f.replaceChildren();
      const top = el("div", "row"); top.append(el("span", "lbl", "FEAR & GREED"), el("span", "num", d.value));
      const bar = el("div", "bar"), dot = el("div", "dot"); dot.style.left = `${d.value}%`; bar.append(dot);
      const bottom = el("div", "row"); bottom.append(el("span", null, "Fear"), el("b", null, d.value_classification), el("span", null, "Greed"));
      f.append(top, bar, bottom);
      f.title = "Crypto Fear & Greed Index (alternative.me), updated daily";
      f.hidden = false; $("marketbar").hidden = false;
    } catch {}
  }
  loadPrices(); loadFng();
  setInterval(loadPrices, 120000);

  // Odometer: unique headlines collected since day one
  if (D.headlines_served) {
    const o = $("odometer"), digits = el("div", "digits");
    for (const ch of String(D.headlines_served).padStart(7, "0")) digits.append(el("span", "d", ch));
    o.append(digits, el("div", null, "HEADLINES SERVED"));
    o.title = `${D.headlines_served.toLocaleString()} unique headlines collected since day one`;
    o.hidden = false;
  }

  // Top stories: the same event covered by several outlets
  if (D.stories && D.stories.length) {
    const box = el("div", "stories");
    const h = el("h2"); h.append(el("span", null, "TOP STORIES")); box.append(h);
    const ol = el("ol");
    for (const st of D.stories) {
      const li = el("li"), det = el("details"), sum = el("summary");
      sum.append(el("span", "t", st.title), el("span", "dots"), el("span", "n", `[${st.outlets} outlets]`));
      det.append(sum);
      const ul = el("ul");
      for (const i of st.items) {
        const it = el("li"), a = el("a", null, i.title);
        a.href = safeUrl(i.url); a.target = "_blank"; a.rel = "noopener noreferrer";
        const meta = el("span", "meta");
        meta.append(el("span", `src ${i.type}`, i.source), " \u00B7 " + ago(i.published));
        it.append(a, meta); ul.append(it);
      }
      det.append(ul); li.append(det); ol.append(li);
    }
    box.append(ol, el("p", "hint", "Click a story to see every outlet covering it."));
    $("stories").append(box);
  }

  function setTab(name) {
    state.tab = D.topics.some((t) => t.name === name) ? name : "All";
    try { localStorage.setItem("mb.tab", state.tab); } catch {}
    render();
    $("tabs").scrollIntoView({ block: "start" });
  }
  function filtered(items) {
    const q = state.q.toLowerCase();
    return items.filter((i) =>
      (state.type === "all" || i.type === state.type) &&
      (!state.onlyNew || isNew(i)) &&
      (!q || i.title.toLowerCase().includes(q) || i.source.toLowerCase().includes(q)));
  }
  const colorOf = (name) => `var(${COLORS[Math.max(0, D.topics.findIndex((t) => t.name === name)) % COLORS.length]})`;

  function itemEl(i, currentTopic) {
    const li = el("li", "item" + (isNew(i) ? " is-new" : ""));
    const a = el("a", "title", i.title);
    a.href = safeUrl(i.url); a.target = "_blank"; a.rel = "noopener noreferrer";
    li.append(a);
    const meta = el("div", "meta");
    meta.append(el("span", `src ${i.type}`, i.source));
    meta.append(" · " + ago(i.published || i.first_seen));
    const others = i.topics.filter((t) => t !== currentTopic);
    if (others.length) meta.append(el("span", "tag", " · also: " + others.join(", ")));
    li.append(meta);
    return li;
  }

  function topicSection(topic, items, preview) {
    const s = el("section", "topic");
    const h = el("h2");
    const label = el("span", "label", (topic.kind === "trend" ? "🔥 " : topic.kind === "pinned" ? "📌 " : "") + topic.name);
    label.style.color = colorOf(topic.name);
    h.append(label, el("span", "count", `${items.length} headline${items.length === 1 ? "" : "s"}`));
    s.append(h);
    const ul = el("ul", "items");
    const showAll = !preview || state.expanded.has(topic.name);
    const shown = showAll ? items : items.slice(0, PREVIEW);
    if (!shown.length) ul.append(el("li", "empty", "Nothing matches."));
    shown.forEach((i) => ul.append(itemEl(i, topic.name)));
    s.append(ul);
    if (preview && items.length > PREVIEW) {
      const b = el("button", "more", showAll ? "[ fewer ]" : `[ all ${items.length} » ]`);
      b.onclick = () => { showAll ? state.expanded.delete(topic.name) : state.expanded.add(topic.name); render(); };
      s.append(b);
    }
    return s;
  }

  function render() {
    const tabs = $("tabs"); tabs.replaceChildren();
    const all = filtered(D.items);
    const mk = (name, n, color) => {
      const b = el("button", "tab" + (state.tab === name ? " active" : ""), name);
      b.style.color = color;
      b.append(el("span", "n", `(${n})`));
      b.onclick = () => setTab(name);
      tabs.append(b);
    };
    mk("All", all.length, "#000");
    for (const t of D.topics) mk(t.name, all.filter((i) => i.topics.includes(t.name)).length, colorOf(t.name));

    const main = $("main"); main.replaceChildren();
    main.classList.toggle("single", state.tab !== "All");
    const topics = state.tab === "All" ? D.topics : D.topics.filter((t) => t.name === state.tab);
    for (const t of topics) {
      const items = all.filter((i) => i.topics.includes(t.name));
      if (state.tab === "All" && !items.length) continue;
      main.append(topicSection(t, items, state.tab === "All"));
    }
    if (!main.children.length) main.append(el("div", "empty", "No headlines match these filters."));
  }

  $("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });
  for (const [segId, key, map] of [["newSeg", "onlyNew", (v) => v === "new"]]) {
    $(segId).addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      for (const x of $(segId).children) x.classList.toggle("on", x === b);
      state[key] = map(b.dataset.v); render();
    });
  }
  if (D.first_run) $("newSeg").style.display = "none";

  // Footer, FEED-style
  const f = $("footer");
  f.append(el("p", "note", "(Bold items are new today. Headlines link to the original source.)"));
  const bad = Object.entries(D.sources).filter(([, v]) => v !== "ok");
  const det = el("details", "small");
  det.append(el("summary", bad.length ? "bad" : null,
    `${Object.keys(D.sources).length} sources checked` + (bad.length ? ` — ${bad.length} with problems` : " — all OK")
    + ` · ${D.items.length} headlines · trend history: ${D.baseline_days} day(s)`));
  const ul = el("ul");
  for (const [k, v] of Object.entries(D.sources)) ul.append(el("li", v === "ok" ? null : "bad", `${k}: ${v}`));
  det.append(ul);
  f.append(det);
  f.append(el("p", "small", "Headlines aggregated automatically from public news feeds. Not financial advice."));

  render();
})();
</script>
</body>
</html>
